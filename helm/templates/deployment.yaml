apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-app
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back
      app.kubernetes.io/instance: back-app
      app.kubernetes.io/version: '1.14.2'
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: back-app
      app.kubernetes.io/managed-by: Helm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back
        app.kubernetes.io/instance: back-app
        app.kubernetes.io/version: '1.14.2'
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: back-app
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: back-container
          image: '{{ .Values.acrName }}.azurecr.io/back:{{ .Values.imageTag }}'
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: '100m'
              memory: '64Mi'
            limits:
              cpu: '200m'
              memory: '128Mi'
